# General pipeline settings.

# How far back to look on each run. Set to 24 so daily runs cover clean,
# non-overlapping windows (no cross-run duplicates) — important for the cloud
# schedule where the dedup store is ephemeral. Bump up only for catch-up runs.
lookback_hours: 24

# Cap transcript length passed downstream (characters) to keep digests lean.
max_transcript_chars: 18000

# Where outputs go (relative to project root).
inbox_dir: data/inbox       # raw fetched items, one JSON per run
digest_dir: data/digests    # finished daily digests

# Email delivery. Local runs send via Gmail SMTP; the recipient + app password
# live in config/secrets.env (gitignored), NOT here, so the repo can stay public.
email:
  enabled: true
  subject_prefix: "📈 AI Signal Digest"

# Tickers to flag with a * WATCH marker in the PDF (your Robinhood watchlist names).
watchlist: [AMD, TSLA, NVDA]

# Model used for the headless `claude -p` scoring pass.
score_model: sonnet
