# ─────────────────────────────────────────────────────────────────────────────
# Your sources. All three types are just RSS feeds under the hood — no API keys.
#
# Manage these by hand, or with the CLI (which preserves these comments):
#   python run.py list
#   python run.py add youtube "Name" "@handle-or-url" [--weight 1.0] [--note "..."]
#   python run.py remove "Name"
#   python run.py disable "Name"   /   python run.py enable "Name"
#
# Per-source fields:
#   url             : feed URL. For YouTube, `add` resolves an @handle/URL for you.
#   weight          : 0.5–2.0, nudges this source's scores. Default 1.0. Optional.
#   enabled         : false to mute a source without deleting it. Default true.
#   note            : free text the scoring agent reads as context. Optional.
#   require_mention : agent drops items from this source that don't mention the
#                     string (used to follow one guest on a shared channel).
# ─────────────────────────────────────────────────────────────────────────────

